<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
    margin:0;
    width:100%;
    background:black;
    color:white;
}


header{ position:relative; /* or use position:relative; if you don't want it to stick at all */ 
       top:0; width:100%; 
       z-index:1000; 
       display:flex; 
       justify-content:space-between; 
       align-items:center; 
       padding:12px 5%;
         background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
      }
  .menu-btn{
    display:none;
}

.logo img{
    width:130px;
    height:auto;
    object-fit:contain;
    display:block;
    transition:.3s ease;
}

.logo img:hover{
    transform:scale(1.05);
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:#ddd;
  text-decoration:none;
}

nav a:hover,
nav a.active{
    color:#ff1f1f;
}
  nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:#ff1f1f;
    transition:0.3s ease;
}

nav a:hover::after,
nav a.active::after{
    width:100%;
}

/* MAIN */
.container{
  width:100%;
  max-width:100%;
  margin:80px 0 40px;
  padding:0 5%;
}



/* TITLE */
.title{
  font-size:40px;
  margin:20px 0;
}

/* TRAILER */
.video-frame{
  width:100%;
  height:70vh;
  border:none;
  border-radius:12px;
  margin-bottom:30px;
}

/* ARTICLE TEXT */
.article-text{
  font-size:18px;
  line-height:1.9;
  color:#e5e5e5;
  max-width:900px;
  padding: 20px;
}

/* RECOMMENDATIONS */
#recGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-top:20px;
}
  .content-wrap{
display:flex;
gap:30px;
align-items:flex-start;
margin-bottom:20px;
}

.poster-column{
width:320px;
flex-shrink:0;
}

.hero-poster{
width:100%;
border-radius:12px;
}

.movie-rating{
text-align:center;
font-size:28px;
margin-top:12px;
}

.article-side{
flex:1;
line-height:1.9;
}

.article-side p{
margin-bottom:18px;
}

.video-frame{
width:100%;
height:550px;
border:none;
border-radius:12px;
}

@media(max-width:768px){

.content-wrap{
flex-direction:column;
}

.poster-column{
width:100%;
max-width:320px;
margin:auto;
}

}


  .hero-wrapper{
  position:relative;
}

.hero-wrapper::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.85)
  );
},

.hero {
  width: 100%;
  height: 450px;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.hero-poster {
  max-height: 100%;
  max-width: 90%;   /* 👈 makes it wider */
  width: auto;
  height: auto;
  object-fit: contain;
}

/* optional: full cinematic header feel */
#mainArea {
  width: 100%;
  max-width: 100%;
}
/* RESPONSIVE */
  .starring-section{
  margin:20px 0;
  padding:15px;
  border-radius:10px;
  background:#1a1a1a;
}

.starring-section h2{
  margin-bottom:10px;
}

.starring-section p{
  line-height:1.6;
}
  /* ARTICLE STYLE (like blog / Wikipedia feel) */
.article-text{
  font-family: "Georgia", serif;
  font-size: 18px;
  line-height: 1.9;
  color: #eaeaea;
  letter-spacing: 0.2px;
  margin: 20px 0;
}

/* Make paragraphs inside article better */
.article-text p{
  margin-bottom: 18px;
}
  #main {
  padding: 20px;
}

/* SUMMARY STYLE (modern / highlighted box) */
.summary-box{
  margin-top: 30px;
  padding: 15px;
  border-radius: 10px;
  background: #111;
  border-left: 4px solid #ffcc00;
}

/* SUMMARY TEXT (different font from article) */
.summary-text{
  font-family: "Arial", sans-serif;
  font-size: 17px;
  line-height: 1.6;
  color: #ccc;
  font-style: italic;
}

/* Optional heading style difference */
.summary-box h2{
  font-family: "Poppins", sans-serif;
  font-size: 20px;
  color: #fff;
}
  /* GRID CONTAINER */
.recommend-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

/* EACH CARD = BLOCK STYLE */
.recommend-card{
  background: #1a1a1a;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  text-align: center;
}

.recommend-card:hover{
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

/* POSTER INSIDE CARD */
.recommend-card img{
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

/* TITLE */
.recommend-card h4{
  font-size: 14px;
  padding: 10px;
  color: #fff;
}
  .site-footer{
  margin-top:60px;
  background:#0f0f0f;
  color:#fff;
  padding:40px 20px;
  text-align:center;
  border-top:1px solid #222;
}

.footer-container{
  max-width:1000px;
  margin:auto;
}

.footer-logo{
  font-size:24px;
  margin-bottom:10px;
}

.footer-text{
  color:#bbb;
  margin-bottom:20px;
  line-height:1.6;
}

.footer-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin-bottom:20px;
}

.footer-links a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:0.8;
  transition:0.3s;
}

.footer-links a:hover{
  opacity:1;
  color:red;
}

.footer-copy{
  font-size:13px;
  color:#777;
}
  .section-title{
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    margin: 45px 0 20px;
    padding-left: 14px;
    border-left: 5px solid #e50914;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: Arial, Helvetica, sans-serif;
}

.section-title::after{
    content: "";
    display: block;
    width: 70px;
    height: 3px;
    background: #e50914;
    margin-top: 8px;
    border-radius: 10px;
}
  .recommend-card h4{
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    margin: 10px 0 6px;
    text-align: center;
    line-height: 1.4;
}

.recommend-card small{
    display: block;
    color: #ffc107;
    font-size: 14px;
    text-align: center;
    font-weight: 500;
    margin-bottom: 10px;
}
.nav-buttons{
  display: flex;
  justify-content: center;   /* center horizontally */
  gap: 12px;
  margin: 20px 0;
}

.btn{
  padding: 10px 16px;
  background: transparent;
  color: #fff;
  text-decoration: none;
  border: 2px solid red;
  border-radius: 8px;
  font-size: 14px;
  transition: 0.3s;
}

.btn:hover{
  background: red;
  color: #fff;
}

  /* MOVIEPULSE VERDICT */
.verdict-box{
  margin:35px 0;
  padding:25px;
  background:linear-gradient(135deg,#151515,#0d0d0d);
  border:1px solid #2a2a2a;
  border-left:5px solid #e50914;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,0.35);
}

.verdict-label{
  color:#e50914;
  font-size:14px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:10px;
}

.verdict-box h2{
  font-size:26px;
  margin-bottom:12px;
}

.verdict-text{
  color:#ccc;
  font-size:17px;
  line-height:1.7;
  margin-bottom:18px;
}

.hype-row{
  display:flex;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.hype-label{
  font-weight:600;
  color:#fff;
}

.hype-bar{
  flex:1;
  min-width:180px;
  height:10px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
}

.hype-fill{
  height:100%;
  background:#e50914;
  border-radius:20px;
}

.hype-score{
  color:#e50914;
  font-weight:700;
}

@media(max-width:768px){
  .verdict-box{
    padding:20px;
  }

  .verdict-box h2{
    font-size:22px;
  }

  .verdict-text{
    font-size:16px;
  }
}
  @media(max-width:768px){

    .menu-btn{
        display:block;
        font-size:30px;
        color:white;
        cursor:pointer;
    }

    nav{
        display:none;
        position:absolute;
        top:75px;
        left:0;
        width:100%;
        background:#111;
        flex-direction:column;
    }

    nav.active{
        display:flex;
    }

    nav a{
        display:block;
        width:100%;
        padding:18px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,.1);
    }
}
  .engagement-box{
    margin-top:15px;
    text-align:center;
}

.rating-box{
    margin-top:15px;
    background:#111;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.rating-box h3{
    color:#e50914;
}

.stars span{
    font-size:35px;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.stars span:hover,
.stars span.active{
    color:#ffd700;
}


.comments-box{
    margin-top:20px;
    background:#111;
    padding:15px;
    border-radius:10px;
    border:1px solid #222;
}


.comments-box h3{
    color:#e50914;
    margin-bottom:10px;
}

    resize:none;
} */
#commentInput{
    width:100%;
    min-height:120px;
    padding:15px;
    background:#161616;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    resize:vertical;
    outline:none;
    transition:.3s;
    font-size:15px;
}

#commentInput:focus{
    border-color:#ff1e1e;
    box-shadow:0 0 15px rgba(255,30,30,.3);
}

.comment-btn{
    margin-top:10px;
    background:#e50914;
    color:white;
    border:none;
    padding:8px 18px;
    border-radius:6px;
    cursor:pointer;
}


.comment-item{
    background:#181818;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    color:#ddd;
}

#commentBtn{
    width:100%;
    margin-top:15px;
    padding:14px 20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#ff1e1e,#b30000);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s ease;
    box-shadow:0 0 15px rgba(255,30,30,.35);
}

#commentBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(255,30,30,.6);
    background:linear-gradient(135deg,#ff3535,#d00000);
}

#commentBtn:active{
    transform:scale(.98);
}

#commentBtn:disabled{
    opacity:.6;
    cursor:not-allowed;
}



</style>
