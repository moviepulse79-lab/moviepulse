  summary:`A Minecraft Movie follows a group of characters who are pulled into the Minecraft world, a place built entirely from blocks, creativity, and survival rules. In this world, everything depends on imagination, building, and teamwork.

As they try to survive in the Overworld, they face dangerous mobs, challenging environments, and unexpected adventures. Each character must learn how to adapt, build, and work together in order to find a way back home.

The story follows their journey of creativity, survival, and discovering that imagination is the most powerful tool in the Minecraft universe.`,
  article:`From my point of view, I always imagine A Minecraft Movie as more than just a video game adaptation. In my idea, it is a story about creativity, survival, and how imagination can shape an entire world.

I see the Minecraft universe as a place where everything is built from ideas. In my imagination, it is not just a game world, but a living environment where every block has meaning and every action can change the outcome of the journey.<br><br>
What I find most interesting is how the characters from the real world adapt to this environment. In my idea, they start off confused because the rules are completely different from reality. There are no normal tools or systems—everything depends on creativity, crafting, and learning how the world works.

I also imagine survival as a major theme. In my version, the characters must learn how to gather resources, build shelter, and defend themselves from dangerous creatures like Creepers, Zombies, and Endermen. At first, everything feels strange and overwhelming, but slowly they begin to understand how the world operates.

As the story continues, I see teamwork becoming very important. In my idea, no one can survive alone in the Minecraft world. Each character brings different skills, and only by working together can they overcome challenges and progress forward.<br><br>
What I find powerful in Minecraft is the idea of creativity. In my imagination, there is no single correct way to survive or succeed. Every problem has multiple solutions, and imagination becomes the most valuable resource.

I also imagine emotional moments where characters realize that this world is not just about survival, but also about discovery. They begin to enjoy building, exploring, and shaping their environment, even while trying to find a way back home.

For me, the strongest theme of A Minecraft Movie is creativity and adaptation. It shows that even when people are placed in unfamiliar situations, they can learn, grow, and build something meaningful from nothing.<br><br>
In the end, I see A Minecraft Movie as a story about imagination, teamwork, and the idea that every world—no matter how strange—can be understood and shaped through creativity and courage.<br><br>

/* ===================== URL ID ===================== */

const params = new URLSearchParams(location.search);
const id = params.get("id");
  


const current = movies.find( m => String(m.id) === String(id));

// =====================
// DYNAMIC SEO METADATA
// =====================

document.title = `${current.title} | MoviePulse`;

const metaDescription = document.querySelector(
  'meta[name="description"]'
);

if (metaDescription) {
  metaDescription.setAttribute(
    "content",
    `${current.title} on MoviePulse. Read the movie article, explore the cast, watch the official trailer, and discover the latest movie details.`
  );
}

let canonical = document.querySelector(
  'link[rel="canonical"]'
);

if (!canonical) {
  canonical = document.createElement("link");
  canonical.rel = "canonical";
  document.head.appendChild(canonical);
}

canonical.href =
  `https://moviepulse247.netlify.app/trailer.html?id=${current.id}`;

/////////////////////////////
// GET RECOMMENDATIONS
/////////////////////////////

function getRecommendations(currentMovie){

  const pool = movies.filter(m => m.id !== currentMovie.id);

  const shuffled = [...pool].sort(() => Math.random() - 0.5);

  return {
    related: shuffled.slice(0, 6),
    more: shuffled.slice(6, 12),
    others: shuffled.slice(12, 50)
  };
}

/////////////////////////////
// RENDER PAGE
/////////////////////////////
/////////////////////////////
// LOAD MAIN MOVIE PAGE
/////////////////////////////

function loadMain(movie){

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  const recommendations = getRecommendations(movie);

  document.getElementById("mainArea").innerHTML = `
  <div class="movie-page">

    <h1 class="title">${movie.title}</h1>

    <div class="content-wrap">

     <div class="poster-column">

  <img class="hero-poster" src="${movie.poster}" alt="${movie.title}">

  <div class="movie-rating">
    ${"⭐".repeat(Math.round(movie.rating || 0))}
  </div>

  <!-- LIKE BUTTON -->
  <div class="engagement-box">

  <div class="rating-box">

<h3>⭐ Rate This Movie</h3>

<div class="stars" id="stars">
    <span data-rate="1">☆</span>
    <span data-rate="2">☆</span>
    <span data-rate="3">☆</span>
    <span data-rate="4">☆</span>
    <span data-rate="5">☆</span>
</div>

<p>
User Rating:
<span id="averageRating">0</span>/5
</p>

<p>
<span id="voteCount">0</span> votes
</p>

</div>

  </div>
  </div>

      <div class="article-side">
        ${movie.article || ""}
      </div>

    </div>

    <div class="article-full"></div>
    
        <div class="verdict-box">

      <div class="verdict-label">🔥 MOVIEPULSE VERDICT</div>

      <h2>${movie.verdictTitle || "Worth Keeping an Eye On?"}</h2>

      <p class="verdict-text">
        ${movie.verdict || "This is one of those movies that deserves a spot on your watchlist. But the real question is... will it live up to the hype? 👀"}
      </p>

      <div class="hype-row">

        <span class="hype-label">🔥 Hype Level</span>

        <div class="hype-bar">
          <div 
            class="hype-fill" 
            style="width:${(movie.hype || movie.rating || 5) * 10}%">
          </div>
        </div>

        <span class="hype-score">
          ${movie.hype || movie.rating || 5}/10
        </span>

      </div>

    </div>

    <h2 class="section-title">Official Trailer</h2>

    <iframe
      class="video-frame"
      src="${movie.trailer || ""}"
      allowfullscreen>
    </iframe>
    
<div class="comments-box">

<h2 class="section-title">💬 Comments</h2>

<textarea id="commentInput" placeholder="Write your comment..."></textarea>

<button id="commentBtn">
Post Comment
</button>

<div id="commentsList"></div>

</div>

    <div class="summary-box">
      <h2 class="section-title">Movie Summary</h2>
      <p>${movie.summary || "No summary available."}</p>
    </div>

    <div class="starring-section">
      <h2 class="section-title">Starring</h2>
      <p>
        ${
          Array.isArray(movie.starring)
            ? movie.starring.join(", ")
            : movie.starring || "N/A"
        }
      </p>
    </div>

    <h2 class="section-title">Featured picks</h2>

    <div class="recommend-grid">
      ${recommendations.related.map(rec => `
        <div class="recommend-card"
          onclick="location.href='trailer.html?id=${rec.id}'">

          <img src="${rec.poster}" alt="${rec.title}">
          <h4>${rec.title}</h4>
          <small>⭐ ${rec.rating || 0}</small>

        </div>
      `).join("")}
    </div>

    <h2 class="section-title">More You May Like</h2>

    <div class="recommend-grid">
      ${recommendations.more.map(rec => `
        <div class="recommend-card"
          onclick="location.href='trailer.html?id=${rec.id}'">

          <img src="${rec.poster}" alt="${rec.title}">
          <h4>${rec.title}</h4>
          <small>⭐ ${rec.rating || 0}</small>

        </div>
      `).join("")}
    </div>

    <h2 class="section-title">Other Movies</h2>

    <div class="recommend-grid">
      ${recommendations.others.map(rec => `
        <div class="recommend-card"
          onclick="location.href='trailer.html?id=${rec.id}'">

          <img src="${rec.poster}" alt="${rec.title}">
          <h4>${rec.title}</h4>
          <small>⭐ ${rec.rating || 0}</small>

        </div>
      `).join("")}
    </div>

  </div>
  `;
}
  

  
  
const backBtn=document.getElementById("backBtn");

if(backBtn){

backBtn.href=id?
`movie.html?id=${id}`:"/";

}
 

const menuBtn = document.querySelector(".menu-btn");
const nav = document.querySelector("nav");

if(menuBtn){

menuBtn.addEventListener("click", function(){
    nav.classList.toggle("active");
});

}



  // =====================
// USER RATING SYSTEM
// =====================


async function setupRating(){

const stars = document.querySelectorAll(".stars span");


stars.forEach(star=>{


star.addEventListener("click", async()=>{


let value = Number(star.dataset.rate);



await addDoc(
collection(db,"ratings"),
{
movieId: current.id,
rating:value,
createdAt:new Date()
}
);



showRating();


});


});


}




async function showRating(){

const average = document.getElementById("averageRating");
const votes = document.getElementById("voteCount");


if(!average || !votes) return;



const snapshot = await getDocs(
collection(db,"ratings")
);



let ratings=[];



snapshot.forEach(doc=>{

const data = doc.data();


if(data.movieId === current.id){

ratings.push(data.rating);

}


});



if(ratings.length===0){

average.innerText="0";
votes.innerText="0";

return;

}



let total = ratings.reduce(
(a,b)=>a+b,0
);



average.innerText =
(total / ratings.length).toFixed(1);



votes.innerText =
ratings.length;


}
// =====================
// COMMENTS SYSTEM
// =====================


async function addComment(){


const input = document.getElementById("commentInput");


if(!input.value.trim()) return;



await addDoc(
collection(db,"comments"),
{
movieId: current.id,
text: input.value,
createdAt:new Date()
}
);



input.value="";


loadComments();


}




async function loadComments(){


const box=document.getElementById("commentsList");


if(!box) return;



const q=query(
collection(db,"comments"),
where("movieId","==",current.id),
orderBy("createdAt","desc")
);



const snapshot=await getDocs(q);



box.innerHTML="";



snapshot.forEach(doc=>{


const data=doc.data();


box.innerHTML += `

<div class="comment-item">

💬 ${data.text}

</div>

`;

});


}

// PAGE LOAD
// PAGE LOAD

document.addEventListener("DOMContentLoaded",()=>{


loadMain(current);


setTimeout(()=>{


setupRating();

showRating();

loadComments();


const btn=document.getElementById("commentBtn");


if(btn){

btn.addEventListener("click",addComment);

}


},500);



const backBtn=document.getElementById("backBtn");


if(backBtn){

backBtn.href=id?
`movie.html?id=${id}`:"/";

}


});
</script>
