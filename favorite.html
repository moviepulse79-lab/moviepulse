<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
      <meta name="description" content="Watch official movie trailers for upcoming and blockbuster films. Find the latest trailers and teasers on MoviePulse.">
<title>MoviePulse — Favorites</title>
      <link rel="icon" type="image/png" href="moviepulse (2).png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
<style>
      
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

      html{
    scroll-behavior:smooth;
}

     body{
    margin:0;
    color:black;
    font-family:'Poppins',sans-serif;

    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: black
}
      
 header{
    position:relative;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 7%;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}
        .links ul{
    display:flex;
    list-style:none;
    gap:25px;
    margin:0;
    padding:0;
}

.links ul li{
    list-style:none;
}

.logo img{
    width:130px;
    height:auto;
    object-fit:contain;
    display:block;
    transition:.3s ease;
}

.logo img:hover{
    transform:scale(1.05);
}




nav{
    display:flex;
    gap:35px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:15px;
    position:relative;
    transition:0.3s ease;
    background:transparent;
    padding:0;
}

nav a:hover,
nav a.active{
    color:#ff1f1f;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:#ff1f1f;
    transition:0.3s ease;
}

nav a:hover::after,
nav a.active::after{
    width:100%;
}@media (max-width:768px){

    .menu-btn{
        display:block;
        font-size:30px;
        cursor:pointer;
        color:#fff;
    }

    .links{
        display:none;
        position:absolute;
        top:75px;
        left:0;
        width:100%;
        background:#111;
    }

    .links.active{
        display:block;
    }

    .links ul{
        flex-direction:column;
        gap:0;
    }

    .links ul li{
        width:100%;
    }

    .links ul li a{
        display:block;
        padding:18px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,.1);
    }
}
      .favorites-page{
    padding:40px 5%;
}


#favoritesContainer{

    display:flex;
    flex-wrap:wrap;
    gap:20px;

}


#favoritesContainer .movie-card{

    width:160px;
    flex-shrink:0;

}


#favoritesContainer .poster-box{

    position:relative;
    overflow:hidden;
    border-radius:10px;

}


#favoritesContainer img{

    width:160px;
    height:240px;
    object-fit:cover;
    display:block;

}


#favoritesContainer h3{

    font-size:14px;
    margin-top:10px;
    color:white;

}


.remove-favorite{

    position:absolute;
    top:8px;
    right:8px;
    z-index:2;

    border:none;
    background:#000;
    border-radius:50%;

    width:35px;
    height:35px;

    cursor:pointer;

}
      /* Empty Favorites */
.empty-favorites {
    min-height: 55vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 20px;
    animation: favoriteFadeIn 0.8s ease;
}

.favorite-sticker {
    position: relative;
    width: 150px;
    height: 150px;
    margin-bottom: 20px;
    animation: stickerFloat 3s ease-in-out infinite;
}

/* Main sticker */
.sticker-heart {
    position: absolute;
    width: 110px;
    height: 100px;
    left: 20px;
    top: 25px;
    background: #e50914;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 58px;
    border-radius: 50%;
    box-shadow:
        0 0 20px rgba(229, 9, 20, 0.45),
        0 0 45px rgba(229, 9, 20, 0.2);
    transform: rotate(-5deg);
}

.sticker-film {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 55px;
    height: 55px;
    background: #111;
    border: 3px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    transform: rotate(12deg);
    box-shadow: 0 5px 15px rgba(0,0,0,0.35);
}

/* Floating decorations */
.floating-heart,
.floating-star {
    position: absolute;
    color: #e50914;
    animation: decorationFloat 2.5s ease-in-out infinite;
}

.heart-one {
    top: 5px;
    left: 5px;
    font-size: 22px;
}

.heart-two {
    bottom: 15px;
    left: 0;
    font-size: 17px;
    animation-delay: 0.7s;
}

.star-one {
    top: 15px;
    right: 5px;
    font-size: 20px;
    animation-delay: 0.3s;
}

.star-two {
    bottom: 5px;
    right: 20px;
    font-size: 15px;
    animation-delay: 1s;
}

.empty-favorites h2 {
    margin: 10px 0;
    font-size: 26px;
    color: #fff;
}

.empty-favorites p {
    max-width: 420px;
    margin: 0 0 25px;
    color: #aaa;
    font-size: 15px;
    line-height: 1.6;
}

.explore-favorites {
    display: inline-block;
    padding: 12px 24px;
    background: #e50914;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    transition: 0.3s ease;
    box-shadow: 0 0 15px rgba(229, 9, 20, 0.25);
}

.explore-favorites:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(229, 9, 20, 0.55);
}

/* Animations */
@keyframes stickerFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-8px) rotate(2deg);
    }
}

@keyframes decorationFloat {
    0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.7;
    }

    50% {
        transform: translateY(-8px) scale(1.15);
        opacity: 1;
    }
}

@keyframes favoriteFadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    .empty-favorites {
        min-height: 50vh;
        padding: 35px 15px;
    }

    .empty-favorites h2 {
        font-size: 22px;
    }

    .empty-favorites p {
        font-size: 14px;
    }
}
  </style>
</head>
  <body>

<header class="nav">
<div class="logo">
    <a href="index.html">
        <img src="ChatGPT Image Jul 7, 2026, 09_00_03 AM.png" alt="MoviePulse Logo">
    </a>
</div>

    
   <div class="menu-btn">
        ☰
    </div>
  
  <nav class="links">
    <a href="index.html">Home</a>
    <a href="poster.html" >Movies</a>
         <a href="shorts.html">Shorts</a>
        <a href="favorites.html" class="active">Favorites</a>
        <a href="about.html">About</a>
    <a href="privacy.html">privacy policy</a>
      <a href="contact.html">Contact</a>
        
  </nav>
</header>
    <section class="favorites-page">

    <h1>My Favorites</h1>
          <div id="emptyFavorites" class="empty-favorites">
    <div class="favorite-sticker">
        <div class="sticker-heart">♥</div>
        <div class="sticker-film">🎬</div>
        <div class="floating-heart heart-one">♥</div>
        <div class="floating-heart heart-two">♥</div>
        <div class="floating-star star-one">✦</div>
        <div class="floating-star star-two">✦</div>
    </div>

    <h2>Your Favorites Are Lonely 💔</h2>

    <p>
        Save movies you love and they'll appear here.
    </p>

    <a href="poster.html" class="explore-favorites">
        Explore Movies
    </a>
</div>

    <div class="posters-row" id="favoritesContainer">

    </div>

</section>
    <script src="movie.js"></script>
<script src="favorite.js"></script>
  </body>
</html>
