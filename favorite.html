<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
      <meta name="description" content="Watch official movie trailers for upcoming and blockbuster films. Find the latest trailers and teasers on MoviePulse.">
<title>MoviePulse — Favorites</title>
      <link rel="icon" type="image/png" href="moviepulse (2).png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
<style>
      
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

      html{
    scroll-behavior:smooth;
}

     body{
    margin:0;
    color:black;
    font-family:'Poppins',sans-serif;

    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: black
}
      
 header{
    position:relative;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 7%;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}
        .links ul{
    display:flex;
    list-style:none;
    gap:25px;
    margin:0;
    padding:0;
}

.links ul li{
    list-style:none;
}

.logo img{
    width:130px;
    height:auto;
    object-fit:contain;
    display:block;
    transition:.3s ease;
}

.logo img:hover{
    transform:scale(1.05);
}




nav{
    display:flex;
    gap:35px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:15px;
    position:relative;
    transition:0.3s ease;
    background:transparent;
    padding:0;
}

nav a:hover,
nav a.active{
    color:#ff1f1f;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:#ff1f1f;
    transition:0.3s ease;
}

nav a:hover::after,
nav a.active::after{
    width:100%;
}@media (max-width:768px){

    .menu-btn{
        display:block;
        font-size:30px;
        cursor:pointer;
        color:#fff;
    }

    .links{
        display:none;
        position:absolute;
        top:75px;
        left:0;
        width:100%;
        background:#111;
    }

    .links.active{
        display:block;
    }

    .links ul{
        flex-direction:column;
        gap:0;
    }

    .links ul li{
        width:100%;
    }

    .links ul li a{
        display:block;
        padding:18px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,.1);
    }
  </style>
</head>
  <body>

<header class="nav">
<div class="logo">
    <a href="index.html">

    </a>
</div>

    
   <div class="menu-btn">
        ☰
    </div>
  
  <nav class="links">

         <a href="shorts.html">Shorts</a>

        <a href="about.html">About</a>
    <a href="privacy.html">privacy policy</a>
      <a href="contact.html">Contact</a>
        
  </nav>
</header>

    <h1>❤️ My Favorites</h1>

    <div class="posters-row" id="favoritesContainer">

    </div>

</section>
    <script src="movie.js"></script>
<script src="favorite.js"></script>
  </body>
</html>
