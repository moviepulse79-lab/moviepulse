<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Movie | MoviePulse</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
    }

    /* ============================= */
    /* HEADER */
    /* ============================= */

    .watch-header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 5%;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: 0.2s;
    }

    .back-btn:hover {
      color: #ff1e1e;
    }

    /* ============================= */
    /* MAIN */
    /* ============================= */

    .watch-page {
      width: min(1200px, 94%);
      margin: 35px auto 60px;
    }

    .watch-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .watch-title span {
      color: #ff1e1e;
    }

    /* ============================= */
    /* PLAYER */
    /* ============================= */

    .player-box {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #242424;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .archive-video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }

    /* ============================= */
    /* LOADING */
    /* ============================= */

    .player-loading {
      min-height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

    .loader {
      width: 45px;
      height: 45px;
      border: 4px solid #333;
      border-top-color: #ff1e1e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================= */
    /* MOVIE INFO */
    /* ============================= */

    .movie-info {
      margin-top: 25px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 22px;
    }

    .movie-info h2 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .movie-meta {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .movie-summary {
      color: #ccc;
      line-height: 1.7;
      font-size: 14px;
    }

    /* ============================= */
    /* SOURCE */
    /* ============================= */

    .source-area {
      margin-top: 18px;
    }

    .source-btn {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: #222;
      padding: 10px 16px;
      border-radius: 7px;
      font-size: 13px;
      transition: 0.2s;
    }

    .source-btn:hover {
      background: #ff1e1e;
    }

    /* ============================= */
    /* ERROR */
    /* ============================= */

    .watch-error {
      padding: 60px 25px;
      text-align: center;
      color: #bbb;
    }

    .watch-error h2 {
      color: #fff;
      margin-bottom: 10px;
    }

    .watch-error p {
      margin-bottom: 20px;
    }

    .error-back {
      display: inline-block;
      background: #ff1e1e;
      color: #fff;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 7px;
      font-weight: 600;
    }

    /* ============================= */
    /* MOBILE */
    /* ============================= */

    @media (max-width: 700px) {

      .watch-header {
        height: 60px;
      }

      .watch-page {
        width: 100%;
        margin-top: 20px;
      }

      .watch-title {
        padding: 0 15px;
        font-size: 21px;
        margin-bottom: 15px;
      }

      .player-box {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .player-loading {
        min-height: 260px;
      }

      .movie-info {
        margin: 18px 15px 0;
      }

    }

  </style>
</head>

<body>

  <header class="watch-header">

    <a
      href="#"
      id="backButton"
      class="back-btn"
    >
      ← Back to Movie
    </a>

  </header>


  <main class="watch-page">

    <h1
      id="watchTitle"
      class="watch-title"
    >
      Watch Movie
    </h1>


    <div
      id="playerBox"
      class="player-box"
    >

      <div class="player-loading">

        <div>

          <div class="loader"></div>

          <p>
            Loading movie player...
          </p>

        </div>

      </div>

    </div>


    <div
      id="movieInfo"
      class="movie-info"
    ></div>

  </main>


  <script src="movie.js"></script>
  <script src="watch.js"></script>

</body>
</html>
