  /* posters row */
  .posters-row {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 40px;
  justify-content: center;

      .poster-box{

.view-btn{

  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  opacity:0;
  transition:0.3s;
}

.poster-box:hover .view-btn{
  opacity:1;
}

.poster-box img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:10px;
}
.card{
    position:relative;
    width:160px;
    flex:0 0 160px;
    border-radius:10px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.04);
    transition:transform .22s ease,box-shadow .22s;
    background:#111;
}
      .card img{
  display:block;
  width:100%;
  height:240px;
  object-fit:cover;
  transition:0.35s ease;
}
  .card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,0.6)}
      .card:hover img{
  transform:scale(1.06);
}
    
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%, rgba(0,0,0,0.7));pointer-events:none}
.meta{
    position:absolute;
    left:8px;
    bottom:8px;
    color:#fff;
    font-size:13px;
    pointer-events:none;
    z-index:5;
    text-shadow:0 2px 5px #000;
}
.hover-buttons{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    transition:.2s;

    pointer-events:none;

    z-index:5;
}
.card:hover .hover-buttons{
    opacity:1;
    pointer-events:auto;
    background:rgba(0,0,0,.45);
}

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.75);

    display:flex;

    position:relative;
    z-index:2;

    max-height:90vh;

    display:flex;
    gap:30px;

    overflow:hidden;
    overflow-y:auto;

    padding:25px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.6);

    animation:popup .25s ease;
}

@keyframes popup{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/////////////////////////////
// ELEMENTS
/////////////////////////////

const postersRow = document.getElementById("postersRow");
const searchInput = document.getElementById("searchInput");
const suggestBox = document.getElementById("suggestBox");

/////////////////////////////
// RENDER MOVIES
/////////////////////////////

function renderMovies(list){

postersRow.innerHTML = list.map(m => `

<div class="card">

    <div class="poster-link" onclick="openMovieModal(${m.id})">

        <img src="${m.poster}" alt="${m.title}">

    </div>


    <div class="meta">

        <h3>${m.title}</h3>

        <div class="year">
            ${m.date || ""}
        </div>


        <div class="stars">
            ${"★".repeat(Math.round(m.rating || 0))}
        </div>


        <div class="genre-tag">
            ${m.genre ? m.genre[0] : ""}
        </div>


    </div>


    <div class="hover-buttons">

        <a class="btn" href="trailer.html?id=${m.id}">
            ▶ view more...
        </a>

    </div>


</div>


`).join("");

}
/////////////////////////////
// INITIAL LOAD
/////////////////////////////

renderMovies(movies);

/////////////////////////////
// SHOW ALL
/////////////////////////////

function showAll(){
  renderMovies(movies);
}

/////////////////////////////
// FILTER BY GENRE (NEW 🔥)
/////////////////////////////
function showGenre(genre){

    const filtered = movies.filter(movie =>
        movie.genre &&
        movie.genre.some(g => g.toLowerCase() === genre.toLowerCase())
    );

    renderMovies(filtered);
}

/////////////////////////////
// SEARCH + SUGGESTIONS
/////////////////////////////

searchInput.addEventListener("input", () => {

  const q = searchInput.value.toLowerCase();

  if(!q){
    suggestBox.style.display = "none";
    renderMovies(movies);
    return;
  }

  const filtered = movies.filter(m =>
    m.title.toLowerCase().includes(q)
  );

  renderMovies(filtered);

  const top = filtered.slice(0, 5);

  suggestBox.innerHTML = top.map(m => `
    <div class="suggest-item" onclick="selectMovie(${m.id})">
      ${m.title}
    </div>
  `).join("");

  suggestBox.style.display = top.length ? "block" : "none";
});

/////////////////////////////
// SELECT MOVIE
/////////////////////////////

function selectMovie(id){
  location.href = `trailer.html?id=${id}`;
}

/////////////////////////////
// CLOSE SUGGESTIONS
/////////////////////////////

document.addEventListener("click", e => {
  if(!e.target.closest(".search-wrap")){
    suggestBox.style.display = "none";
  }
});

/////////////////////////////
// ENTER SEARCH
/////////////////////////////

searchInput.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    location.href = `poster.html?q=${encodeURIComponent(searchInput.value)}`;
  }
});

/////////////////////////////
// NAV TO TRAILER
/////////////////////////////

function goTrailer(id){
  location.href = `trailer.html?id=${id}`;
}

      const menuBtn = document.querySelector(".menu-btn");
const nav = document.querySelector(".links");

menuBtn.addEventListener("click", () => {
    nav.classList.toggle("active");
});

      function setFilter(button){

    document.querySelectorAll(".filter-bar button").forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");
}

function openMovieModal(id){

    const movie = movies.find(m => m.id === id);

    if(!movie){
        return;
    }
      
  currentMovieId = movie.id;

    document.getElementById("modalPoster").src = movie.poster;

    document.getElementById("modalTitle").textContent = movie.title;


    document.getElementById("modalGenre").textContent =
        movie.genre ? movie.genre.join(" • ") : "Genre unavailable";


    document.getElementById("modalSummary").textContent =
        movie.summary || "No summary available.";


    document.getElementById("modalCast").innerHTML =
        movie.starring 
        ? movie.starring.map(name => `<li>${name}</li>`).join("")
        : "<li>Unknown</li>";


    document.getElementById("modalTrailer").href =
        `trailer.html?id=${movie.id}`;


document.getElementById("movieModal").classList.add("show");

document.getElementById("modalBackdrop").style.backgroundImage =
movie.backdrop 
? `url(${movie.backdrop})`
: `url(${movie.poster})`;

}


function toggleFavorite(){

    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    if(favorites.includes(currentMovieId)){

        favorites = favorites.filter(id => id !== currentMovieId);

        document.getElementById("modalFavorite").innerHTML =
        "🤍 Add Favorite";

    }else{

        favorites.push(currentMovieId);

        document.getElementById("modalFavorite").innerHTML =
        "❤️ Added";

    }

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

}


function closeMovieModal(){

    document.getElementById("movieModal")
    .classList.remove("show");

}
</script>
