<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="moviepulse (2).png">
 <meta name="description" content="Watch latest movie trailers, reviews, cast details and updates on MoviePulse.">
<meta name="keywords" content="movies, trailers, film reviews, MoviePulse, cinema updates">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
       body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: black;
        color: white;
    }
        header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: rgba(0,0,0,0.85);
        border-bottom: 1px solid red;
    }
.menu-btn{
    display:none;
    font-size:30px;
    color:#fff;
    cursor:pointer;
}

    .navbar ul {
        list-style: none;
        display: flex;
        gap: 25px;
        margin: 0;
        padding: 0;
    }
    .navbar ul li a {
        color: white;
        text-decoration: none;
        font-size: 16px;
    }
    .navbar ul li a:hover,
    .navbar ul li a.active {
        color: red;
        border-bottom: 2px solid red;
        padding-bottom: 2px;
    }.logo img {
    width: 160px;
    height: auto;
    display: block;
    object-fit: contain;
    max-height: 60px;
  cursor: pointer;
  border-radius: 14px;

    animation: logoFloat 3s ease-in-out infinite;

    transition: 
        transform 0.4s ease,
        filter 0.4s ease;
}
  .logo img:hover {
    border-radius:10px;
  }

.shorts-page {
     padding: 70px 4% 40px;
    background: #000;
    min-height: 100vh;
}


.shorts-title {
    text-align: center;
    margin-bottom: 18px;
}


.shorts-title p {
    color: #aaa;
    font-size: 18px;
     margin-top: 10px;
}


.shorts-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    padding: 20px 0;
}
    @media(max-width: 900px){

    .shorts-container {
        grid-template-columns: repeat(2, 1fr);
    }

}


@media(max-width: 600px){

    .shorts-container {
        grid-template-columns: 1fr;
    }

}


.shorts-container::-webkit-scrollbar {
    height: 8px;
}


.shorts-container::-webkit-scrollbar-thumb {
    background: #e50914;
    border-radius: 10px;
}


.short-card {
    min-width: 300px;
    max-width: 300px;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #222;
    padding: 10px;
}


.short-card:hover {
    transform: translateY(-8px);
    border-color: #e50914;
}


.short-card iframe {
    width: 100%;
    height: 190px;
    border: none;
}
    .short-card .tiktok-embed {
    width: 100% !important;
    max-height: 520px;
    overflow: hidden;
}


.short-card h3 {
    color: white;
    font-size: 18px;
    margin: 15px 10px 5px;
}



.short-card p {
    color: #aaa;
    font-size: 14px;
    margin: 0 10px 15px;
}
    @media(max-width:768px){

    .short-card {
        min-width: 280px;
        max-width: 280px;
    }

}
    .watch-movie-btn{
    display:block;
    width:90%;
    margin:15px auto 20px;
    text-align:center;
    background:#E50914;
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:600;
    transition:.3s;
}

.watch-movie-btn:hover{
    background:#ff2b2b;
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(229,9,20,.5);
}
.shorts-filter {
    text-align:center;
    margin:30px 0;
}


.shorts-filter button {

    background:#111;
    color:white;
    border:1px solid #e50914;
    padding:10px 20px;
    margin:5px;
    border-radius:20px;
    cursor:pointer;
    transition:.3s;

}


.shorts-filter button:hover {

    background:#e50914;

}


/* Active category */
.shorts-filter button.active-filter {

    background:#e50914;
    color:white;
    box-shadow:0 0 15px rgba(229,9,20,0.7);

}
.shorts-search {
    display:flex;
    justify-content:center;
    margin:35px 0;
}


.search-box {
    position:relative;
    width:75%;
    max-width:700px;
}


.search-box input {

    width:100%;
    padding:18px 60px 18px 25px;

    background:#111;
    color:white;

    border:1px solid #333;
    border-radius:35px;

    font-size:18px;

    outline:none;

}


.search-box input:focus {

    border-color:#e50914;
    box-shadow:0 0 18px rgba(229,9,20,0.5);

}


.search-box input::placeholder {

    color:#888;

}


.search-box input{
    width:100%;
    padding:18px 60px 18px 25px;
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#e50914;
    font-size:22px;
    cursor:pointer;
}
</style>
</head>
<body>
    <header>
    <div class="logo">
        <a href="index.html">
            <img src="ChatGPT Image Jul 7, 2026, 09_00_03 AM.png" alt="MoviePulse Logo">

    </div>

    <div class="menu-btn">
        ☰
    </div>

    <nav class="navbar">
        <ul id="menu">

            <li><a href="shorts.html" class="active">Shorts</a></li>

❤️ Favorites
</a>
            <li><a href="about.html" >About</a></li>
            <li><a href="privacy.html">Privacy Policy</a></li>
            <li><a href="contact.html">Contact</a></li>
          
        </ul>
    </nav>
</header>

<section class="shorts-page">

    <div class="shorts-title">
        <p>Watch the latest movie moments, trailers and cinematic clips.</p>
    </div>
    
<div class="shorts-search">

<div class="search-box">

    <input
        type="text"
        id="short-search"
        placeholder="Search Shorts...">

    <button type="button" class="search-icon" onclick="searchShorts()">
        🔍
    </button>

</div>

</div>
    <div class="shorts-filter">

    <button onclick="filterShorts('All')">All</button>
    <button onclick="filterShorts('Action')">Action</button>
    <button onclick="filterShorts('Horror')">Horror</button>
    <button onclick="filterShorts('Romance')">Romance</button>
    <button onclick="filterShorts('Superhero')">Superhero</button>
    <button onclick="filterShorts('Drama')">Drama</button>

</div>

<div class="shorts-container" id="shorts-container"></div>


</section>


<script src="shorts.js"></script>
<script src="shorts-display.js"></script>

</body>
</html>
