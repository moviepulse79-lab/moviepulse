    display: block;

  border-radius: 14px;

    transition: 
        transform 0.4s ease,
        filter 0.4s ease;
}
  .logo img:hover {
    border-radius:10px;
  }

.shorts-page {
    padding: 120px 5% 50px;
    background: #000;
    min-height: 100vh;
}


.shorts-title {
    text-align: center;
    margin-bottom: 40px;
}


.shorts-title h1 {
    color: #fff;
    font-size: 40px;
    text-transform: uppercase;
}


.shorts-title p {
    color: #aaa;
    font-size: 18px;
}


.shorts-container {
    display: flex;
    gap: 25px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding-bottom: 20px;
}


.shorts-container::-webkit-scrollbar {
    height: 8px;
}


.shorts-container::-webkit-scrollbar-thumb {
    background: #e50914;
    border-radius: 10px;
}


.short-card {
    min-width: 330px;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #222;
    transition: 0.3s;
}


.short-card:hover {
    transform: translateY(-8px);
    border-color: #e50914;
}


.short-card iframe {
    width: 100%;
    height: 190px;
    border: none;
}


.short-card h3 {
    color: white;
    padding: 15px 15px 5px;
}


.short-card p {
    color: #aaa;
    padding: 0 15px 20px;
    line-height: 1.5;
}
