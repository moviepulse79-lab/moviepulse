
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MoviePulse - Reset Password</title>

    <link rel="icon"
          type="image/png"
          href="moviepulse (2).png">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }


        body {

            min-height: 100vh;

            background: #050505;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        .reset-wrapper {

            width: 100%;

            max-width: 1000px;

            min-height: 600px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            background: #0d0d0d;

            border-radius: 22px;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,.08);

            box-shadow:
                0 30px 80px rgba(0,0,0,.8),
                0 0 50px rgba(229,9,20,.08);
        }


        /* =========================
           LEFT SIDE
        ========================= */

        .reset-form-section {

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px;
        }


        .reset-box {

            width: 100%;

            max-width: 390px;
        }


        .reset-logo {

            width: 150px;

            margin-bottom: 30px;
        }


        h1 {

            font-size: 31px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #999;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            color: #ddd;

            font-size: 13px;

            margin-bottom: 7px;
        }


        .password-wrapper {

            position: relative;
        }


        input {

            width: 100%;

            padding: 14px 48px 14px 15px;

            background: #151515;

            border: 1px solid #292929;

            border-radius: 9px;

            color: white;

            outline: none;

            font-size: 14px;

            transition: .25s;
        }


        input:focus {

            border-color: #e50914;

            box-shadow:
                0 0 0 3px rgba(229,9,20,.1);
        }


        .show-password {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            background: none;

            border: none;

            color: #888;

            cursor: pointer;

            font-size: 13px;
        }


        .show-password:hover {

            color: white;
        }


        .reset-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #e50914;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;

            margin-top: 5px;
        }


        .reset-button:hover {

            background: #ff1e1e;

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(229,9,20,.25);
        }


        .reset-button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        .message {

            margin-top: 18px;

            text-align: center;

            font-size: 13px;

            color: #aaa;

            line-height: 1.5;
        }


        .back-login {

            display: block;

            margin-top: 25px;

            text-align: center;

            color: #e50914;

            text-decoration: none;

            font-size: 13px;

        }


        .back-login:hover {

            text-decoration: underline;
        }


        /* =========================
           RIGHT SIDE
        ========================= */

        .visual-section {

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(229,9,20,.16),
                    transparent 55%
                ),
                #080808;
        }


        .visual-section::before {

            content: "";

            position: absolute;

            width: 450px;

            height: 450px;

            border-radius: 50%;

            background: rgba(229,9,20,.08);

            filter: blur(80px);
        }


        .moviepulse-logo {

            position: relative;

            z-index: 3;

            width: 190px;

            margin-bottom: 35px;
        }


        .poster-stack {

            position: relative;

            width: 360px;

            height: 290px;
        }


        .poster {

            position: absolute;

            width: 155px;

            height: 230px;

            object-fit: cover;

            border-radius: 12px;

            border: 2px solid rgba(255,255,255,.12);

            box-shadow:
                0 20px 45px rgba(0,0,0,.7);

            transition: .5s ease;
        }


        .poster.one {

            left: 15px;

            top: 25px;

            transform: rotate(-13deg);

            z-index: 1;
        }


        .poster.two {

            left: 103px;

            top: 0;

            z-index: 3;
        }


        .poster.three {

            right: 15px;

            top: 25px;

            transform: rotate(13deg);

            z-index: 2;
        }


        .poster-stack:hover .poster.one {

            transform:
                translateX(-15px)
                rotate(-18deg)
                translateY(-8px);
        }


        .poster-stack:hover .poster.three {

            transform:
                translateX(15px)
                rotate(18deg)
                translateY(-8px);
        }


        .visual-title {

            position: relative;

            font-size: 18px;

            margin-top: 20px;
        }


        .visual-text {

            position: relative;

            color: #888;

            font-size: 13px;

            margin-top: 7px;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            body {

                padding: 15px;
            }


            .reset-wrapper {

                grid-template-columns: 1fr;

                max-width: 500px;
            }


            .visual-section {

                order: -1;

                min-height: 390px;

                padding: 35px 20px;
            }


            .reset-form-section {

                padding: 40px 25px;
            }


            .moviepulse-logo {

                width: 160px;
            }


            .poster-stack {

                transform: scale(.75);

                margin: -25px 0;
            }

        }


        @media (max-width: 450px) {

            body {

                padding: 0;
            }


            .reset-wrapper {

                min-height: 100vh;

                border-radius: 0;

                border: none;
            }


            .visual-section {

                min-height: 350px;
            }


            .poster-stack {

                transform: scale(.65);
            }


            .reset-form-section {

                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>


<div class="reset-wrapper">


    <!-- LEFT -->

    <section class="reset-form-section">

        <div class="reset-box">


            <img
                class="reset-logo"
                src="ChatGPT Image Jul 7, 2026, 09_00_03 AM.png"
                alt="MoviePulse"
            >


            <h1>
                Reset Password
            </h1>


            <p class="subtitle">

                Create a new password for your MoviePulse
                account.

            </p>


            <form id="resetForm">


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            data-target="newPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="reset-button"
                    id="resetButton"
                >
                    Update Password
                </button>


            </form>


            <div
                class="message"
                id="resetMessage">
            </div>


            <a
                href="auth.html"
                class="back-login"
            >
                ← Back to Sign In
            </a>


        </div>

    </section>



    <!-- RIGHT -->

    <section class="visual-section">


        <img
            class="moviepulse-logo"
            src="ChatGPT Image Jul 7, 2026, 09_00_03 AM.png"
            alt="MoviePulse"
        >


        <div class="poster-stack">


            <img
                class="poster one"
                src="https://www.themoviedb.org/t/p/w600_and_h900_face/wP0GdqwVu2g1y3q1KzBXuSrdTvX.jpg"
                alt="Movie poster"
            >


            <img
                class="poster two"
                src="https://www.themoviedb.org/t/p/w600_and_h900_face/xsrkiXg8EuNNtbPtbmvCxg95gK7.jpg"
                alt="Movie poster"
            >


            <img
                class="poster three"
                src="https://www.themoviedb.org/t/p/w600_and_h900_face/3SifFCwwFzXdU1Ew0nA4Z92Bs15.jpg"
                alt="Movie poster"
            >


        </div>


        <h2 class="visual-title">
            Welcome Back
        </h2>


        <p class="visual-text">
            Your favorite movies are waiting for you.
        </p>


    </section>


</div>



<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const resetForm =
    document.getElementById("resetForm");

const resetButton =
    document.getElementById("resetButton");

const resetMessage =
    document.getElementById("resetMessage");


// ===============================
// SHOW / HIDE PASSWORD
// ===============================

document.querySelectorAll(".show-password")
.forEach(button => {

    button.addEventListener("click", () => {

        const input =
            document.getElementById(
                button.dataset.target
            );


        if (input.type === "password") {

            input.type = "text";

            button.textContent = "Hide";

        } else {

            input.type = "password";

            button.textContent = "Show";

        }

    });

});


// ===============================
// UPDATE PASSWORD
// ===============================

resetForm.addEventListener("submit", async (e) => {

    e.preventDefault();


    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (newPassword.length < 6) {

        resetMessage.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    if (newPassword !== confirmPassword) {

        resetMessage.textContent =
            "Passwords do not match.";

        return;
    }


    resetButton.disabled = true;

    resetButton.textContent =
        "Updating...";

    resetMessage.textContent = "";


    try {

        const { error } =
            await supabaseClient.auth.updateUser({

                password: newPassword

            });


        if (error) throw error;


        resetMessage.textContent =
            "Password updated successfully! Redirecting...";


        setTimeout(() => {

            window.location.href =
                "auth.html";

        }, 2000);


    } catch (error) {

        console.error(
            "Password update error:",
            error
        );


        resetMessage.textContent =
            error.message;


        resetButton.disabled = false;

        resetButton.textContent =
            "Update Password";

    }

});

</script>

</body>

</html>
